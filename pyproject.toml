[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "customer-churn-ml"
version = "0.1.0"
description = "Customer churn prediction service"
requires-python = ">=3.10"

dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "xgboost==3.2.0",
    "joblib==1.6.0",
    "pydantic==2.13.5",
]


[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "numpy==2.4.6",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.setuptools.packages.find]
where = ["src"]