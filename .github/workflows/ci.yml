name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # -------------------------
  # 1. Test
  # -------------------------
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest


  # -------------------------
  # 2. Build and push to ECR
  # -------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    # Only push images for pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t customer-churn-api .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::532287339230:role/GitHubActionsECRRole
          aws-region: ap-south-1
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: customer-churn-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag customer-churn-api:latest $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker tag customer-churn-api:latest $REGISTRY/$REPOSITORY:latest

          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest


  # -------------------------
  # 3. Deploy to EC2
  # -------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::532287339230:role/GitHubActionsECRRole
          aws-region: ap-south-1
          role-session-name: GitHubActionsDeploy

      - name: Deploy to EC2
        env:
          AWS_REGION: ap-south-1
          INSTANCE_ID: i-0099245cc92caf34e
          ECR_REGISTRY: 532287339230.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: customer-churn-api
          S3_BUCKET: customer-churn-ml-models-deepak
          S3_MODEL_KEY: models/churn_pipeline.joblib
        run: |
          aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"sudo docker pull $ECR_REGISTRY/$ECR_REPOSITORY:latest\",
              \"sudo docker rm -f customer-churn-api || true\",
              \"sudo docker run -d --name customer-churn-api -p 8000:8000 -e S3_BUCKET=$S3_BUCKET -e S3_MODEL_KEY=$S3_MODEL_KEY $ECR_REGISTRY/$ECR_REPOSITORY:latest\"
            ]"